[package]
name = "iac-controlplane"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "iac_controlplane"
path = "src/lib.rs"

[[bin]]
name = "iac-controlplane"
path = "src/main.rs"

[dependencies]
iac-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
jiff = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
indexmap = { workspace = true }
serde_yaml_ng = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
reqwest = { workspace = true }
futures-util = "0.3"
axum-server = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
# Phase 7da.1: ssh_push worker keeps a TempDir for ControlMaster sockets.
tempfile = { workspace = true }

# Phase 9 follow-up: heap profiling (CP RSS grew 27→59 MB over a quiet
# 24h F1 #11 soak; agents stable). Enabled via `--features heap-profiling`
# for ad-hoc investigation; default off so the production binary stays
# unaffected. The dhat profiler swaps in as the global allocator only
# when the feature is on, writes dhat-heap.json on Drop.
dhat = { version = "0.3", optional = true }

# Phase 9 follow-up #2: mimalloc as an opt-in global allocator. The
# dhat investigation showed the F1 #11 +32 MB RSS was glibc malloc
# arena fragmentation rather than a Rust leak. mimalloc releases
# memory back to the OS more aggressively than glibc, so operators
# who care about RSS footprint on long-running CP servers can opt
# in with `--features mimalloc`. Default off so the production
# binary keeps its current allocator behaviour unchanged.
# Mutually exclusive with `heap-profiling` (dhat is also a global
# allocator); the build script enforces this at compile-time via
# a compile_error! in main.rs.
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
heap-profiling = ["dep:dhat"]
# Use mimalloc as the global allocator. Reduces glibc arena
# fragmentation on long-running CP processes. Cannot be combined
# with heap-profiling.
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
tempfile = { workspace = true }
iac-agent = { workspace = true }
