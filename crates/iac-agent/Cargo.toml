[package]
name = "iac-agent"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "iac_agent"
path = "src/lib.rs"

[[bin]]
name = "iac-agent"
path = "src/main.rs"

[features]
default = ["wasm"]
# Phase 10: WASM-module provider. Requires wasmtime/cranelift, which
# does NOT support MIPS architectures. Disable for MIPS / OpenWrt
# cross-compiles via `--no-default-features`.
wasm = ["iac-providers/wasm"]

[dependencies]
iac-core = { workspace = true }
# Phase 10: direct path dep instead of `{ workspace = true }` so we
# can disable `iac-providers/wasm` (the workspace decl can't be
# overridden for default-features by a member). The workspace decl
# remains for other crates that want full features.
iac-providers = { path = "../iac-providers", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }
indexmap = { workspace = true }
reqwest = { workspace = true }
globset = { workspace = true }
rustls-pemfile = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# Phase 7cz.14: non-poisoning Mutex for rusqlite connection guard.
parking_lot = { workspace = true }
# Phase 9 follow-up: capability allowlist + WASM module hot-reload
# wrap shared state in ArcSwapOption so the watcher tasks can swap
# updated values without a tokio-RwLock async dance.
arc-swap = { workspace = true }
# Phase 9 follow-up: WASM-module change-detector hashes module
# bytes on disk and compares against startup baseline. Same hash
# function used by the existing `module_sha256` pin verification
# in iac-providers/wasm/spec.rs.
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Phase 7dc: e2e wasm-provider test compiles its fixture from WAT at
# test time so we don't need a wasm32 toolchain in CI.
wat = { workspace = true }
# Phase 7dd: e2e component-model test wraps a pre-built core wasm
# fixture into a WIT component on the fly.
wit-component = { workspace = true }
