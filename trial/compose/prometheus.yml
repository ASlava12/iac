# Phase 8 trial Prometheus config.
#
# Scrapes:
#   1. The control-plane's `/v1/metrics` endpoint (Prometheus
#      text-exposition format already, gated to Viewer — we send
#      the trial admin token via `bearer_token`).
#   2. Prometheus itself (sanity).
#
# Agent metrics are NOT scraped directly; the agent process
# doesn't expose a /metrics HTTP endpoint today (Phase 8.4
# follow-up). Instead we infer per-agent health from the
# control-plane's `iac_agent_*` counters which already aggregate
# across the fleet.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    fleet: trial

scrape_configs:
  - job_name: controlplane
    metrics_path: /v1/metrics
    static_configs:
      - targets: ["controlplane:8443"]
    authorization:
      type: Bearer
      credentials: trial-admin-token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
