# Phase 9 fleet trial inventory.
#
# 10 Ubuntu 24.04 x86_64 VPS provisioned 2026-05-05. SSH via the
# `iac-fleet-trial-20260505` key (~/.ssh/iac_fleet) as root.
#
# Network topology — two firstbyte.club regions:
#   * Region A (104.128.140.0/24)  — 3 hosts, ~10 ms intra-DC RTT
#   * Region B (45.138 + 185.x)    — 7 hosts, ~30 ms A↔B inter-DC RTT
# ICMP is blocked at the provider; use TCP/22 for liveness probes.
#
# Roles:
#   `controlplane` — exactly one. Runs `iac-controlplane` + sqlite store.
#   `cp_spare`     — warm spare; F7 backup/restore target. Idle until used.
#   `agent`        — runs `iac-agent` daemon registered against the CP.

[fleet]
ssh_user = "root"
ssh_key = "~/.ssh/iac_fleet"
controlplane_port = 8443
admin_token = "fleet-trial-admin-token-2026-05-05"

# ---- Region A: cp + spares ---------------------------------------

[[hosts]]
name = "cp-01"
ip = "104.128.140.54"
role = "controlplane"
region = "A"

[[hosts]]
name = "cp-spare-01"
ip = "104.128.140.48"
role = "cp_spare"
region = "A"

[[hosts]]
name = "cp-spare-02"
ip = "104.128.140.49"
role = "cp_spare"
region = "A"

# ---- Region B: 7 agents ------------------------------------------

[[hosts]]
name = "agent-01"
ip = "45.138.74.147"
role = "agent"
region = "B"

[[hosts]]
name = "agent-02"
ip = "185.106.93.142"
role = "agent"
region = "B"

[[hosts]]
name = "agent-03"
ip = "185.106.93.170"
role = "agent"
region = "B"

[[hosts]]
name = "agent-04"
ip = "185.106.93.191"
role = "agent"
region = "B"

[[hosts]]
name = "agent-05"
ip = "185.217.197.85"
role = "agent"
region = "B"

[[hosts]]
name = "agent-06"
ip = "185.217.197.215"
role = "agent"
region = "B"

[[hosts]]
