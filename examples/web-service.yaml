# Example: a small web service with health gate.
#
# Demonstrates `metadata.dependsOn` graph + monitoring.check as a
# canary gate. The graph below declares:
#   * docker.container needs the file (config) before it starts
#   * monitoring.check needs the container up before it probes
# With `--canary-pct 25` the control plane uses these edges to compute
# phased layers; if the health probe fails after retries, the canary
# fails, the baseline batch is cancelled, and the operator sees the
# failure in the audit log before the bad config rolls fleet-wide.
#
# Heads-up: the v1 `iac` CLI flattens `metadata.dependsOn` during
# YAML→JSON round-tripping (the Metadata struct in iac-core doesn't
# carry the field yet). Until that gap closes, submit this manifest
# through the API directly (`POST /v1/operations` with the field
# preserved) if you need the dispatch ordering; with `iac apply` the
# resources fan out into one layer.
---
apiVersion: iac.example/v1
kind: file
metadata:
  name: webapp-config
  environment: prod
  dependsOn: []
spec:
  path: /etc/webapp/config.json
  mode: "0644"
  content: |
    {
      "listen": "0.0.0.0:8080",
      "log_level": "info",
      "feature_flag_x": true
    }
---
apiVersion: iac.example/v1
kind: docker.container
metadata:
  name: webapp
  environment: prod
  # Container can't run without its config file.
  dependsOn: ["file/prod/webapp-config"]
spec:
  name: webapp
  image: ghcr.io/example/webapp:v1.2.3
  ports: ["8080:8080"]
  volumes:
    - "/etc/webapp/config.json:/app/config.json:ro"
  restart_policy: unless-stopped
  state: present
---
apiVersion: iac.example/v1
kind: monitoring.check
metadata:
  name: webapp-health
  environment: prod
  # Health check waits for the container to come up.
  dependsOn: ["docker.container/prod/webapp"]
spec:
  name: webapp-health
  type: http
  target: http://localhost:8080/healthz
  expected_status: 200
  timeout_secs: 3
  # Phase 7cj: retry budget = (1 + retries) * timeout + retries * interval.
  # 5 retries * 2s interval + 6 attempts * 3s timeout = 28s of grace.
  # Tune to your service's startup time.
  retries: 5
  retry_interval_secs: 2
