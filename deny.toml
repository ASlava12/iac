# cargo-deny config — license + advisory + duplicate hygiene.
#
# Run from the repo root:
#   cargo deny --workspace --all-features check
#
# CI policy: any new "deny" or non-allowlisted advisory is a build
# failure. Existing acknowledgements live below with reasoning so a
# future audit knows why we shipped what we shipped.

[graph]
all-features = true

# ---- advisories ----------------------------------------------------

[advisories]
# Default behaviour: deny on any vulnerability, warn on unmaintained.
# Override per-advisory via the `ignore` list with a comment.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # ───────────── wasmtime 26.0.1 advisories ─────────────
    # We ship wasmtime as an OPT-OUT cargo feature on iac-agent /
    # iac-providers (Phase 10, commit f3f0a21). Default builds carry
    # the runtime, but `cargo build --no-default-features` on iac-agent
    # produces a binary with no wasmtime linkage at all — the
    # router/edge target audience builds without it.
    #
    # All 13 wasmtime advisories below trigger only when WASM
    # *modules* are loaded. The trial harness doesn't load any; default
    # production deployments without `[[wasm_providers]]` configured
    # don't load any.
    #
    # Bumping wasmtime 26 → 44 (the latest fixed line) involves API
    # changes across 7 trait signatures + WasiView reorganisation —
    # tracked separately as TODO; out of scope for the Phase 9 fleet
    # work because wasmtime can't be cross-compiled to MIPS anyway,
    # which made the feature flag the right immediate response.
    "RUSTSEC-2025-0046",  # wasmtime: fd_renumber WASIp1 panic
    "RUSTSEC-2025-0118",  # wasmtime: shared linear memory unsound API
    "RUSTSEC-2026-0020",  # wasmtime: WASI resource exhaustion
    "RUSTSEC-2026-0021",  # wasmtime: wasi:http fields panic
    "RUSTSEC-2026-0085",  # wasmtime: flags component panic
    "RUSTSEC-2026-0086",  # wasmtime: 64-bit table host data leakage
    "RUSTSEC-2026-0087",  # wasmtime: f64x2.splat segfault on x86-64
    "RUSTSEC-2026-0088",  # wasmtime: lazy initialization
    "RUSTSEC-2026-0089",  # wasmtime: panic on resume
    "RUSTSEC-2026-0091",  # wasmtime: OOB string transcoding
    "RUSTSEC-2026-0092",  # wasmtime: misaligned UTF-16 panic
    "RUSTSEC-2026-0093",  # wasmtime: heap OOB read transcoding
    "RUSTSEC-2026-0094",  # wasmtime: table.grow Winch
    "RUSTSEC-2026-0095",  # wasmtime: Winch sandbox escape
    "RUSTSEC-2026-0096",  # wasmtime: aarch64 Cranelift sandbox escape

    # `paste` is unmaintained but still functions. wasmtime depends
    # on it transitively; will retire when wasmtime upgrades.
    "RUSTSEC-2024-0436",  # paste — unmaintained
    # `rustls-pemfile` v2 is unmaintained but no safe upgrade exists
    # at time of writing (rustls hasn't picked up its replacement
    # yet). Pulled in via `axum-server` (TLS termination on CP) and
    # for client-side TLS in iac-agent. No code-execution surface;
    # the crate just parses PEM files we already trust at config-load
    # time. Track upstream rustls release plan for the retirement.
    "RUSTSEC-2025-0134",  # rustls-pemfile — unmaintained
]

# ---- licenses ------------------------------------------------------

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",                   # Boost Software License
    "CDLA-Permissive-2.0",       # Linux Foundation permissive data license
]
confidence-threshold = 0.93

# ---- bans / duplicates --------------------------------------------

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `*` from workspace-internal path deps is fine — those resolve to the
# workspace member's pinned version. Catch only true `version = "*"`
# entries (a copy-paste smell).
allow-wildcard-paths = true

# ---- sources ------------------------------------------------------

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
