# cargo-deny config — license + advisory + duplicate hygiene.
#
# Run from the repo root:
#   cargo deny --workspace --all-features check
#
# CI policy: any new "deny" or non-allowlisted advisory is a build
# failure. Existing acknowledgements live below with reasoning so a
# future audit knows why we shipped what we shipped.

[graph]
all-features = true

# ---- advisories ----------------------------------------------------

[advisories]
# Default behaviour: deny on any vulnerability, warn on unmaintained.
# Override per-advisory via the `ignore` list with a comment.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # ───────────── wasmtime ─────────────
    # The 16 wasmtime / wasmtime-wasi advisories (RUSTSEC-2026-0094..0096,
    # -0149, et al.) are FIXED: wasmtime is bumped to 36.0.7, the patched
    # line covering all of them. No ignores needed. `wasm` is also an
    # opt-in feature (default = []), so default fleet builds don't link it
    # at all — defence in depth, not a CVE crutch. Keep `audit.toml` in
    # sync with this list.

    # `paste` is unmaintained but still functions. Pulled transitively
    # (wasmtime, opt-in only); will retire when the dep drops it.
    "RUSTSEC-2024-0436",  # paste — unmaintained
    # `rustls-pemfile` v2 is unmaintained but no safe upgrade exists
    # at time of writing (rustls hasn't picked up its replacement
    # yet). Pulled in via `axum-server` (TLS termination on CP) and
    # for client-side TLS in iac-agent. No code-execution surface;
    # the crate just parses PEM files we already trust at config-load
    # time. Track upstream rustls release plan for the retirement.
    "RUSTSEC-2025-0134",  # rustls-pemfile — unmaintained

    # `rsa` (Marvin timing attack) is pulled by `sqlx-mysql`, which is an
    # OPTIONAL sqlx driver we never enable (no `mysql` feature; the `any`
    # feature does not pull it). Verified unreachable: `cargo tree -i rsa
    # --target all` prints nothing — rsa/sqlx-mysql are stale Cargo.lock
    # entries, compiled into no binary. No fixed `rsa` upgrade exists
    # upstream regardless. Re-check if we ever enable the mysql driver.
    "RUSTSEC-2023-0071",  # rsa — unreachable (sqlx-mysql, mysql disabled)
]

# ---- licenses ------------------------------------------------------

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",                   # Boost Software License
    "CDLA-Permissive-2.0",       # Linux Foundation permissive data license
]
confidence-threshold = 0.93

# ---- bans / duplicates --------------------------------------------

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `*` from workspace-internal path deps is fine — those resolve to the
# workspace member's pinned version. Catch only true `version = "*"`
# entries (a copy-paste smell).
allow-wildcard-paths = true

# ---- sources ------------------------------------------------------

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
