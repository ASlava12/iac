# Configuration for `cargo audit`.
#
# We ignore advisories below only after verifying the affected crate is
# present in `Cargo.lock` as an unused, phantom optional dependency — i.e.
# `cargo build` does not compile it into any binary in this workspace.
# Each entry must include the verification command and reasoning.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: Marvin attack on RSA decryption timing.
    #
    # Path:  rsa 0.9.x ← sqlx-mysql ← sqlx 0.8.x ← iac-controlplane.
    #
    # Phase 2a uses sqlx with only the `sqlite` backend feature enabled
    # (see workspace Cargo.toml). `sqlx-mysql` is declared `optional = true`
    # in sqlx 0.8.6's Cargo.toml and is NOT activated by our feature set, but
    # cargo records optional deps in Cargo.lock regardless. Verified that
    # neither `rsa` nor `sqlx-mysql` compile into our binaries:
    #
    #   $ cargo tree -i rsa
    #   warning: nothing to print.
    #   $ cargo build -p iac-controlplane 2>&1 | grep -i rsa  # empty
    #   $ ls target/debug/deps/ | grep -i 'rsa\|mysql'        # empty
    #
    # We will revisit when sqlx-mysql drops `rsa` or when we move to a
    # different storage layer.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2025-0134: rustls-pemfile is unmaintained (informational
    # warning, not a vulnerability).
    #
    # Path:  rustls-pemfile 2.2.0
    #          ← iac-controlplane (direct, for TLS cert parsing)
    #          ← iac-agent (direct, for TLS cert parsing)
    #          ← axum-server 0.7.3 (transitive)
    #
    # The crate is functional and ships maintained APIs; the upstream is
    # winding down in favor of `rustls-pki-types`'s built-in PEM helpers.
    # We will migrate to `pki_types::pem` once axum-server does. Tracked
    # as a Phase 8+ backlog item.
    "RUSTSEC-2025-0134",
]
