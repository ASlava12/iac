# cargo-audit configuration.
#
# This MIRRORS the `[advisories].ignore` list in `deny.toml` so that
# `cargo audit` and `cargo deny check advisories` agree on policy — keep
# the two in sync. Every entry is a documented, accepted exception, not a
# silent suppression; see deny.toml for the per-advisory rationale.
#
# Summary: the wasmtime advisories are gated behind the OPT-IN `wasm`
# feature (default = [] across iac-agent / iac-providers / iac-cli), so
# default fleet builds link no wasmtime. Tracked follow-up: bump wasmtime
# to >=36.0.7 before re-enabling `wasm` by default.

[advisories]
ignore = [
    # The wasmtime/wasmtime-wasi advisories are FIXED by the bump to
    # 36.0.7 — no ignores needed. Only the unmaintained-crate and
    # unreachable-rsa exceptions remain (see deny.toml for rationale).
    # unmaintained (transitive) — no safe bump yet
    "RUSTSEC-2024-0436",  # paste
    "RUSTSEC-2025-0134",  # rustls-pemfile
    # rsa: pulled only by the OPTIONAL, never-enabled sqlx-mysql driver.
    # `cargo tree -i rsa --target all` is empty — stale lock artifact,
    # compiled into nothing. No upstream fix exists. See deny.toml.
    "RUSTSEC-2023-0071",  # rsa — unreachable (mysql driver disabled)
]
