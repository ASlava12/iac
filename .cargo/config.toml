# Phase 10: cross-compile to Tier-3 MIPS targets needs build-std with
# explicit components. The `release-mini` profile keeps `panic = "unwind"`
# (Tier-3 MIPS can't link `panic_abort` under cross's build-std), so only
# `std` is listed here. The unstable flags are only consumed when building
# with nightly + an explicit Tier-3 `--target`; stable / x86_64-host
# builds ignore this section.

[unstable]
build-std = ["std"]
